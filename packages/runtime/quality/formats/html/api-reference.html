<!doctype html>
<html lang="en" data-doc-type="api-reference">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <link rel="stylesheet" href="base.css">
  </head>
  <body>
    <main>
      <header id="title">
        <p>API reference</p>
        <h1>{{title}}</h1>
        <p class="summary">{{summary}}</p>
      </header>

      <section id="endpoint">
        <h2>Endpoint</h2>
        {{endpoint}}
      </section>

      <section id="authentication">
        <h2>Authentication</h2>
        {{authentication}}
      </section>

      <section id="parameters">
        <h2>Parameters</h2>
        {{parameters}}
      </section>

      <section id="request-example">
        <h2>Request example</h2>
        {{request_example}}
      </section>

      <section id="response">
        <h2>Response</h2>
        {{response}}
      </section>

      <section id="errors">
        <h2>Errors</h2>
        {{errors}}
      </section>
    </main>
  </body>
</html>
