# DocsFab operational limits. Canonical source for generated mirrors.
# Each limit lives in config/limits/<owner>.yaml, where <owner> is the first
# dot-segment of its name. This root registers every fragment; the generator
# composes them in the order listed here, which is also the row order of the
# generated mirrors, `docsfab doctor --limits`, and service-status.
# Do not edit generated files; change a fragment (or this registry) and run
# `npm run generate:limits` from packages/runtime.
schemaVersion: 1
kind: docsfab-limits
fragments:
