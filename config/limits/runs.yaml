# DocsFab operational limits owned by the `runs` name prefix.
# Registered in config/limits.yaml; every limit here is named `runs.*`.
# Change this file and run `npm run generate:limits` from packages/runtime.
limits:
  - name: runs.deletionGateAttempts
    value: 1200
    unit: count
    scope: per-host
    warnAt: 0.8
    override: null
    min: 1
    max: 1200
    refusal: runs-deletion-gate-attempts-bound
    remediation: Wait for the other local writer or deletion to finish. A complete private lock with a proven-dead owner is recovered automatically; inspect an unknown or incomplete lock before manual recovery.
    rationale: Maximum acquisition attempts for the local run and run-index maintenance gates. At the paired default retry pause this permits about 30 seconds of ordinary live-owner contention. A complete private lock with a proven-dead owner is reclaimed through pinned identity checks; an unknown or incomplete owner is never reclaimed. The run-deletion and crash-resume fixtures exercise this shared limit.

  - name: runs.deletionGateRetryPauseMs
    value: 25
    unit: milliseconds
    scope: per-host
    warnAt: 0.8
    override: null
    min: 1
    max: 1000
    refusal: runs-deletion-gate-retry-pause-ms-bound
    remediation: Wait for the other local writer or deletion to finish; inspect the private maintenance lock only after verifying quiescence.
    rationale: Pause between bounded attempts to acquire a local run or run-index maintenance gate, avoiding a busy loop while retaining a finite refusal for a live or ambiguous owner. It shares the acquisition budget with runs.deletionGateAttempts.

  - name: runs.deletionGateHelperTimeoutMs
    value: 30000
    unit: milliseconds
    scope: per-host
    warnAt: 0.8
    override: null
    min: 1
    max: 30000
    refusal: runs-deletion-gate-helper-timeout-ms-bound
    remediation: Check host CPU and filesystem load, then rerun the exact operation. An interrupted helper leaves the gate state unknown and requires inspection before another attempt.
    rationale: Longest time one isolated run-gate release or proven-dead owner recovery helper may execute before the caller kills it and refuses. Matches the separately measured 30-second SCM receipt helper ceiling; normal local filesystem exchanges are shorter. The helper has no captured output and only an exit-code protocol.

  - name: runs.deletionInventoryMaxEntries
    value: 10000
    unit: count
    scope: per-run
    warnAt: 0.8
    override: null
    min: 1
    max: 1000000
    refusal: runs-deletion-inventory-max-entries-bound
    remediation: Move unrelated historical state into another supported private root, or raise runs.deletionInventoryMaxEntries in config/limits/runs.yaml and preview again. Record and artifact byte-size limits remain separate.
    rationale: Provisional implementation choice for issue 1794. Maximum structural JSON containers and variable-length filesystem entries scanned while previewing deletion across a saved run, content objects, and retained owners. The supported 566156-byte successful review record has 2263 structural containers, and its artifact pool has 15 quality objects with 207 structural containers in total; the default of 10000 covers that combined journey with room for ordinary retained records. Record and object byte-size bounds independently limit scalar/string payloads. Refuse the whole preview instead of truncating an ownership scan.

  - name: runs.indexMaxBytes
    value: 67108864
    unit: bytes
    scope: per-host
    warnAt: 0.8
    override: null
    min: 4096
    max: 1073741824
    refusal: runs-index-max-bytes-bound
    remediation: Move the run-index directory aside and rebuild it from the saved records with docsfab runs import, or raise runs.indexMaxBytes in config/limits/runs.yaml or the host limits file.
    rationale: Size of one append-only run index (#1184). docsfab runs query reads the whole file. The two eight-case matrices of September 23, 2026 index to about 200 KiB, so 64 MiB holds several hundred matrices. An append that would cross the bound is refused and recorded in the index overflow file, which every query reports; rows are never truncated.

  - name: runs.recordMaxBytes
    value: 67108864
    unit: bytes
    scope: per-run
    warnAt: 0.8
    override: DOCSFAB_RUNS_RECORD_MAX_BYTES
    min: 4096
    max: 536870887
    refusal: runs-record-max-bytes-bound
    remediation: Set DOCSFAB_RUNS_RECORD_MAX_BYTES, or the host limits file or config/limits/runs.yaml entry for runs.recordMaxBytes, above the record size (at most 536870887 bytes), then rerun the same command. The saved record is unchanged.
    rationale: One bound for every reader of one saved run record (#1932), namely docsfab runs list and import, docsfab why, local publication preflight, delivery acceptance, the live agent's saved-run tool, and operator input fills. It replaces six separate ceilings of 2, 2, 4, 4, 10 and 16 MiB, two of which reported an oversized record as malformed or invalid. The largest record in the September 23, 2026 matrices was 810 KB (#1184) and a smoke record was 312 KB; a record grows with steps, telemetry and per-file limitations rather than with repository size, so 64 MiB leaves about eighty times headroom over the largest measured record. The maximum is the largest UTF-8 JSON record the whole-string reader can parse, as for recovery.logicalObjectMaxBytes. A larger record is refused or listed by this name with its observed size; docsfab runs import names it and still imports the rest.
    docValue: 67,108,864 bytes (64 MiB)
    docSummary: Largest saved run record any DocsFab reader loads, such as `docsfab runs list`, `docsfab why`, publication preflight, and the live agent's saved-run tool.

  - name: runs.indexImportMaxRecords
    value: 10000
    unit: count
    scope: per-run
    warnAt: 0.8
    override: null
    min: 1
    max: 1000000
    refusal: runs-index-import-max-records-bound
    remediation: Import fewer state directories or harness batches per docsfab runs import invocation, or raise runs.indexImportMaxRecords in config/limits/runs.yaml.
    rationale: Record files one docsfab runs import invocation considers across its paths (#1184), matching the 10,000-record docsfab runs list ceiling. Over the bound the import refuses before it writes any row.

  - name: runs.indexFieldMaxChars
    value: 512
    unit: characters
    scope: per-run
    warnAt: 0.8
    override: null
    min: 64
    max: 4096
    refusal: runs-index-field-max-chars-bound
    remediation: Read the value from the saved run record with docsfab runs show, or raise runs.indexFieldMaxChars in config/limits/runs.yaml and re-import the record.
    rationale: Longest identifier-like record value one index row copies, such as a rejection location, model name, or step ID (#1184). It matches the docsfab runs list field ceiling. A longer value, or one with control characters, is stored as unavailable and named in the row's omittedFields, which every query counts.

  - name: runs.summaryPatchFiles
    value: 10
    unit: count
    scope: per-run
    warnAt: 0.8
    override: null
    min: 1
    max: 1000
    refusal: runs-summary-patch-files-bound
    remediation: Read every changed file in the retained patch named on the RECORD line, or with docsfab runs show <run-id> --json, or raise runs.summaryPatchFiles in config/limits/runs.yaml.
    rationale: Changed files the human PATCH section of a run result lists, one line each with its insertion and deletion counts, before a PATCH omitted count of the rest. Presentation only; the run record, the retained patch artifact, and the JSON result always carry every changed file. Migrated unchanged, Task(#1334), from a hand-declared presenter constant of the same value that the limits identifier rule did not match; 10 keeps a typical single-page documentation change fully listed while a bulk restructure stays short.

  - name: runs.credentialFindingLocationChars
    value: 1024
    unit: characters
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_RUNS_CREDENTIAL_FINDING_LOCATION_CHARS
    min: 256
    max: 4096
    refusal: runs-credential-finding-location-chars-bound
    remediation: Read the cut location's path from the repository with the digest the marker names, or set DOCSFAB_RUNS_CREDENTIAL_FINDING_LOCATION_CHARS (256 through 4096) on the host, or change runs.credentialFindingLocationChars in config/limits/runs.yaml, and run again to record longer locations whole.
    rationale: Longest location a credential-like-content finding keeps in a run record (#1807). A finding is heuristic and must never stop a record from decoding or publishing, so a longer location is not refused; it keeps its line number and is cut at a visible marker that carries a digest of the whole location, so two long paths stay distinct. Record readers accept any location up to the maximum, so changing the value leaves older records readable. The longest tracked path in the six benchmark checkouts audited for this change (#1807) and in this repository is 186 characters, so 1024 leaves more than five times that; 4096 is the longest Linux path.
    docValue: 1,024 characters
    docSummary: Longest `credential-like-content` finding location a run record keeps; a longer one is cut at a marker that carries a digest of the whole location.
