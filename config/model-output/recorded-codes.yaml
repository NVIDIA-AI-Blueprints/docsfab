# Every rejection code the catalog has ever declared (ADR question 8, approved
# in #1128 note 71135882). Recorded codes live in run records, so they are
# never renamed or removed: each entry here must stay a declared code, or be
# listed in the `aliases` of the rule that replaced it. Append new codes; never
# delete an entry.
#
# `pinned` fixes a security or authority code's kind (ADR "Pinned terminal
# codes"). The code, or the rule that aliases it, must keep that kind and stay
# terminal; any change is a `pinned-code` gate finding that needs an allowlist
# rationale. Codes the ADR pins that no family declares yet (for example
# credential-material) are pinned when their family migrates (#1289).
