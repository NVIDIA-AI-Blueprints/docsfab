design_inputs:
  - upstream: documentation-skill-collection
    commit: 9237f739cead79d145139bd1afd9ce7463e08283
    inspected_at: 2026-08-19
    use: Compacted overlapping documentation workflows and methods into runtime workflows and ten reusable skills; repository-specific skill-router, agent-memory, Jira, Confluence, plugin, and fixed-framework assumptions were excluded.

  - upstream: documentation-skill-collection
    commit: c2ae4ef512c849daf563d5b693caf9f0ebcd1710
    inspected_at: 2026-09-14
    use: Distilled page-purpose, complete-example, reader-review, and correction methods into eight consolidated skills, folding focused polish into writing; reconciled scope and evidence conflicts and removed plugin-runtime assumptions. See packages/skills/DISTILLATION.md.

