# DocsFab operational limits owned by the `hostInvoker` name prefix.
# Registered in config/limits.yaml; every limit here is named `hostInvoker.*`.
# Change this file and run `npm run generate:limits` from packages/runtime.
limits:
  - name: hostInvoker.contextPreflightBudgetMs
    value: 300000
    unit: ms
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_HOSTED_CONTEXT_PREFLIGHT_BUDGET_MS
    min: 1
    max: 300000
    refusal: hosted-context-preflight-budget-ms-bound
    remediation: Raise DOCSFAB_HOSTED_CONTEXT_PREFLIGHT_BUDGET_MS within the closed ceiling, or raise hostInvoker.contextPreflightBudgetMs in config/limits/hostInvoker.yaml.
    rationale: Wait allowance for one hosted structural compile, defaulting to the existing admitted maximum. This bounds how long the runner waits, not the lifetime of the index build.
    docValue: 300,000 ms (5 minutes)
    docSummary: Wait for one hosted structural compile; this does not terminate the index build.

  - name: hostInvoker.frozenInputMaxBytes
    value: 98304
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 98304
    refusal: host-invoker-frozen-input-max-bytes-bound
    remediation: Reduce the frozen input or qualify a coordinated carrier change; live-agent turns use their separately derived question envelope.
    rationale: Names the existing 96 KiB per-input representation boundary without changing ordinary workflows. The live-agent event envelope is derived from maximum question bytes plus maximum admitted metadata and JSON escaping.

  - name: hostInvoker.frozenInputsMaxBytes
    value: 131072
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 131072
    refusal: host-invoker-frozen-inputs-max-bytes-bound
    remediation: Reduce combined frozen inputs or qualify a coordinated carrier change; the live-agent allowance preserves this envelope's non-question remainder.
    rationale: Names the existing 128 KiB aggregate frozen-input representation boundary. Live-agent turns add only the growth of their computed event beyond the ordinary per-input capacity.

  - name: hostInvoker.requestMaxBytes
    value: 524288
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 524288
    refusal: host-invoker-request-max-bytes-bound
    remediation: Reduce the complete runtime request or qualify its representation; live-agent request capacity includes the measured extra JSON escaping of its larger question event.
    rationale: Names the existing 512 KiB complete worker-request boundary for ordinary workflows. The live-agent wire adds twice its event-capacity growth because the event JSON is carried as a JSON string; actual serialized bytes are checked before dispatch and again at the worker.

  - name: hostInvoker.credentialMaxBytes
    value: 16384
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 16384
    refusal: host-invoker-credential-max-bytes-bound
    remediation: Supply the model credential within the shared one-shot custody envelope; a larger handle needs the writing producer and this reader qualified together.
    rationale: Shared model-credential handle capacity. The producer enforces the same number on its single write and the worker reads at most that many bytes before zeroing them, so the two sides declare one value. The protected authority-file allowance covers configuration and plan reads and is a different envelope that must not be substituted here.

  - name: hostInvoker.descriptorNumberMax
    value: 16
    unit: count
    scope: sealed
    warnAt: 0.8
    override: none
    min: 3
    max: 16
    refusal: host-invoker-descriptor-number-max-bound
    remediation: Pass the request, credential and replay inputs on inherited descriptor numbers within the admitted range, or qualify a wider spawn contract on both sides first.
    rationale: Largest inherited file-descriptor number this worker accepts on its command line. Descriptors zero through two are the standard streams, so three is the lowest inheritable slot; the upper value is this contract's own admission and is not an operating-system ceiling.

  - name: hostInvoker.requestStepIdsMax
    value: 64
    unit: count
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 64
    refusal: host-invoker-request-step-ids-max-bound
    remediation: Dispatch a workflow whose installed step list fits the admitted request shape; a longer installed workflow needs this capacity and the installed catalog qualified together.
    rationale: Admitted length of the step-identifier list on a hosted runtime request. It is a shape bound checked before any execution decision. The exact installed workflow identity and step order are still compared against the installed catalog afterwards, so this value never selects which steps run.

  - name: hostInvoker.capsuleEvidenceMaxItems
    value: 128
    unit: count
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 128
    refusal: host-invoker-capsule-evidence-max-items-bound
    remediation: Select fewer evidence entries for the projected capsule, or qualify the projecting producer and this reader together before raising the count.
    rationale: Admitted number of selected-evidence entries in a projected context capsule. The producing source admission is smaller today, so this is the reader's outer shape bound rather than an external protocol maximum. Capsule digest and expiry checks stay independent of it.

  - name: hostInvoker.capsuleEvidenceItemMaxBytes
    value: 131072
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 131072
    refusal: host-invoker-capsule-evidence-item-max-bytes-bound
    remediation: Shorten the individual evidence entry, or qualify the projecting producer and this reader together before raising the per-entry capacity.
    rationale: Admitted size of one selected-evidence entry's content in a projected context capsule. Producers project smaller per-source excerpts today; this is the outer per-entry framing bound, and the aggregate projected-evidence capacity applies in addition to it rather than instead of it.

  - name: hostInvoker.capsuleEvidenceJsonMaxBytes
    value: 262144
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 262144
    refusal: host-invoker-capsule-evidence-json-max-bytes-bound
    remediation: Select less evidence for the projected capsule, or qualify the context-budget producer and this reader together before raising the aggregate capacity.
    rationale: Admitted serialized size of the projected selected-evidence collection measured by this reader. It measures that projection only, and the complete request envelope and the dispatcher's context budget are separate envelopes with their own numbers, and aliasing them to this one would silently change what each admits.

  - name: hostInvoker.editorialEvidenceRefsMax
    value: 128
    unit: count
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 128
    refusal: host-invoker-editorial-evidence-refs-max-bound
    remediation: Reduce the editorial outcome's evidence references, or qualify the deciding producer and this reader together before raising the count.
    rationale: Admitted number of evidence references in a projected editorial outcome. The producing decision validates its own references first and this reader keeps the same count so a projected outcome and its replay stay comparable; evidence is never truncated to fit a smaller envelope.

  - name: hostInvoker.editorialLimitationsMax
    value: 128
    unit: count
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 128
    refusal: host-invoker-editorial-limitations-max-bound
    remediation: Reduce the editorial outcome's limitations, or qualify the producing decision policy, the projector's added diagnostic codes and this reader together before raising the count.
    rationale: Admitted number of limitation codes in a projected editorial outcome. The projector unions the decision's own limitations with added diagnostic codes, so headroom for those additions belongs to this count. It is deliberately not aliased to the evidence-reference count even though both currently carry the same number.

  - name: hostInvoker.editorialLimitationMaxChars
    value: 256
    unit: characters
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 256
    refusal: host-invoker-editorial-limitation-max-chars-bound
    remediation: Shorten the individual limitation code, or qualify the producing decision policy and this reader together before raising the per-code capacity.
    rationale: Admitted length of one limitation code in a projected editorial outcome, counted in UTF-16 units. Count, code grammar and length carry distinct semantics, so a shorter list never licenses a longer code and the producing policy's own code syntax still applies.

  - name: hostInvoker.approvedModelBaselineMaxBytes
    value: 16777216
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 16777216
    refusal: host-invoker-approved-model-baseline-max-bytes-bound
    remediation: Stage a smaller admitted baseline, or qualify the staging producer, the custody reference reader and the content-addressed carrier together before raising the capacity.
    rationale: Admitted size of the one private file carrying a complete admitted approved-model baseline for a native job. It matches the content-addressed object capacity the same deployment already admits, because the staged bytes are the whole closure (claims, conflicts and provenance) rather than the model text alone. The producer checks it before it opens the file and the reader checks the declared size before it allocates, so both sides refuse the same number instead of trusting a caller-declared length.

  - name: hostInvoker.gitOutputMaxBytes
    value: 8388608
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 8388608
    refusal: host-invoker-git-output-max-bytes-bound
    remediation: Narrow the Git invocation so it returns less, or qualify the hardened invocation and every caller that passes this ceiling together before raising it.
    rationale: Largest combined standard-output and standard-error size the hardened Git invocation accumulates before it kills the process group. It is the ceiling passed by the callers that copy a whole selected revision, not the ordinary per-call allowance, and crossing it is a refusal rather than a truncation, so the caller never reads a silently shortened tree or patch. It is sealed because an environment override on a confinement bound would widen what an untrusted working tree can return.

  - name: hostInvoker.gitTimeoutMs
    value: 10000
    unit: ms
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 10000
    refusal: host-invoker-git-timeout-ms-bound
    remediation: Split the work into separately bounded Git invocations, or qualify the hardened invocation and its confinement contract before changing this deadline.
    rationale: Wall-clock deadline after which the hardened Git invocation kills its whole process group. It bounds one child process rather than a workflow step or a hosted run, and the kill is a refusal the caller sees rather than an empty successful result. It is sealed because a per-process override on a confinement deadline would let a hung or hostile invocation outlive the bound the worker relies on.

  - name: hostInvoker.gitDefaultOutputMaxBytes
    value: 1048576
    unit: bytes
    scope: sealed
    warnAt: 0.8
    override: none
    min: 1
    max: 1048576
    refusal: host-invoker-git-default-output-max-bytes-bound
    remediation: Pass an explicitly qualified larger ceiling at the one call that needs it, or qualify this ordinary allowance and its callers together before raising it.
    rationale: Output allowance an ordinary hardened Git invocation gets when the caller names none. It is deliberately smaller than the whole-revision ceiling so that status, rev-parse and diff calls refuse early instead of inheriting a copy-sized budget; a caller that genuinely needs more passes the larger catalogued ceiling by name. It is sealed for the same reason the whole-revision ceiling is, being a confinement bound rather than a work allowance.
