    remediation: Set DOCSFAB_COMPOSITION_EXECUTION_ANSWER_NOW_TURN_LATENCY_MS to an integer from 25000 through 120000.
    rationale: Time the answer-now reserve charges each planned answer turn before its first output token (time to first token plus per-call overhead). 25,000 ms is the top of the planning range the closed-schema answer records decision (#1961, section 4.2) uses, 8 to 25 seconds, because a forced answer turn prefills the whole reading context and values above 15 seconds are expected there. Override may only raise it, which moves the ask earlier; the maximum is two minutes, where the two planned turns alone take 240,000 ms of a 300,000 ms attempt. It is a declared design planning default for every composition, not a per-composition measurement, and it can be optimistic for long answer turns. The retained step 8 attempts measured per-turn upper bounds (attempt duration over provider turns, decode included) with a median of 9.4 seconds on Super through build.nvidia.com, and up to 118 seconds on two-turn continuation attempts at a 300,000 ms timer. The composition re-qualification of issue 1973 replaces it with measured latencies when it reseals each composition.
