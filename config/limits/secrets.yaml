# DocsFab operational limits owned by the `secrets` name prefix.
# Registered in config/limits.yaml; every limit here is named `secrets.*`.
# Change this file and run `npm run generate:limits` from packages/runtime.
limits:
  - name: secrets.lockWaitMs
    value: 15000
    unit: ms
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_LOCK_WAIT_MS
    min: 1
    max: 15000
    refusal: secrets-lock-wait-ms-bound
    remediation: Let the other docsfab setup finish, then rerun docsfab setup. If no docsfab process is running, remove the named lock file.
    rationale: Longest time an explicit setup change waits for the configuration-root lock before refusing. The lock covers the whole change, which replaces secrets.env, a model profile, and host.yaml, each through a flushed temporary file. On September 30, 2026, 300 whole-change holds on a loaded macOS shared host (load average about 21) measured p50 89 to 96 ms, p95 259 to 322 ms, and max 453 ms. A September 22, 2026 measurement of secrets.env-only writes found max 215 ms. 15 s therefore queues about 33 writers at the observed worst case and more than 150 at p50, and it stays above secrets.lockStaleMs so a waiter can recover an abandoned lock. A live same-host holder is never taken over, so a longer stall ends in this coded refusal rather than a lost update. Operators may only lower it.

  - name: secrets.lockStaleMs
    value: 10000
    unit: ms
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_LOCK_STALE_MS
    min: 1
    max: 10000
    refusal: secrets-lock-stale-ms-bound
    remediation: Lower DOCSFAB_SECRETS_LOCK_STALE_MS so effective stale stays below secrets.lockWaitMs, or lower secrets.lockStaleMs in config/limits/secrets.yaml. A live same-host holder is never taken over.
    rationale: Age after which a secrets.env lock is treated as abandoned, applied only when its owner cannot be checked, such as a lock written from another host or an unreadable owner record. A lock whose owner runs on this host is never aged out; it is recovered only after that process is gone. 10 s is about 22 times the 453 ms worst whole-change hold measured for secrets.lockWaitMs and stays below that wait bound. A holder that is aged out anyway rechecks its lock token before each file rename, stops with secrets-env-lock-lost, and puts back only the files it replaced that no newer writer has replaced since. Operators may only lower it.

  - name: secrets.lockRetryMs
    value: 25
    unit: ms
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_LOCK_RETRY_MS
    min: 1
    max: 25
    refusal: secrets-lock-retry-ms-bound
    remediation: Lower DOCSFAB_SECRETS_LOCK_RETRY_MS, or lower secrets.lockRetryMs in config/limits/secrets.yaml.
    rationale: Pause between exclusive-create attempts on the secrets.env lock. It paces the wait loop; secrets.lockWaitMs bounds the total wait. Operators may only lower it.

  - name: secrets.configuredCredentialMinChars
    value: 12
    unit: chars
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_MIN_CHARS
    min: 8
    max: 64
    refusal: secrets-configured-credential-min-chars-bound
    remediation: Lower DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_MIN_CHARS, or secrets.configuredCredentialMinChars in the host limits file, to compare a shorter configured credential, or configure a longer credential. docsfab doctor names each configured credential this minimum leaves uncompared.
    rationale: Shortest configured credential value the exact-match screens compare (#1807). This is a minimum, not a capacity allowance. After the owner decision (#1807), an exact match against DocsFab's own credentials is the one credential check that fails closed, so a value short enough to occur by chance in repository text or a model reply would stop runs that carry no credential. 12 is the length the strict credential-value rule and the diagnostic secret redaction already use, and the model keys and the GitLab and Slack tokens DocsFab configures are longer. Operators may lower it, down to 8, the shortest memorized secret NIST SP 800-63B permits, to compare a shorter credential. A value that short can also occur in ordinary text, such as a common word or an identifier, so more runs refuse content that holds no credential. They may raise it, to at most 64, to compare fewer values. docsfab doctor names every configured value the effective minimum leaves uncompared, never the value or its length.
    docValue: 12 characters
    docSummary: Shortest configured credential value the exact-match screens compare. You can lower it to 8 to compare shorter values, or raise it to 64 to compare fewer.

  - name: secrets.configuredCredentialFragmentChars
    value: 16
    unit: chars
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_FRAGMENT_CHARS
    min: 16
    max: 64
    refusal: secrets-configured-credential-fragment-chars-bound
    remediation: Raise DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_FRAGMENT_CHARS, or secrets.configuredCredentialFragmentChars in the host limits file, so that only a longer piece of a configured credential matches. A longer piece lets a shorter truncated echo through.
    rationale: Shortest piece of a configured credential the exact-match screens match, so a truncated echo, such as an error message that cuts a key short, still matches (#1807). This is a minimum, not a capacity allowance. 16 is longer than the longest public prefix of a credential DocsFab configures (13 characters, for Anthropic keys), so every piece holds secret characters. Pieces come only from whitespace-free values that are not URLs, and only from the signature of a JWT, so a PEM header, a URL host, or a JWT header that other credentials share never matches. Operators may raise it, to at most 64, so that fewer partial echoes match. It cannot go lower, because a shorter piece could hold only the public prefix of a configured key and would match every example of that key's format.
    docValue: 16 characters
    docSummary: Shortest piece of a configured credential that matches, so a truncated echo is still found. You can raise it to 64 so that only longer pieces match.

  - name: secrets.configuredCredentialMinDistinctChars
    value: 5
    unit: chars
    scope: per-host
    warnAt: 0.8
    override: DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_MIN_DISTINCT_CHARS
    min: 1
    max: 16
    refusal: secrets-configured-credential-min-distinct-chars-bound
    remediation: Lower DOCSFAB_SECRETS_CONFIGURED_CREDENTIAL_MIN_DISTINCT_CHARS, or secrets.configuredCredentialMinDistinctChars in the host limits file, to compare a repetitive configured credential, or configure a credential with more distinct characters. docsfab doctor names each configured credential this minimum leaves uncompared.
    rationale: Fewest distinct characters a configured credential value, or a piece of one, needs before the exact-match screens compare it (#1807). This is a minimum, not a capacity allowance. A run such as xxxxxxxxxxxxxxxx, a mask left in an environment variable, or the tail of a fixture token of one repeated letter would otherwise match masks, digests, and padding throughout documentation and stop runs that carry no credential. A real credential is random, so every 16-character piece of one holds far more, about 14 distinct characters for base62, 10 for hex, and 8 for the digit runs inside a Slack token. 5 removes repetition and alternation and keeps every one of those. Operators may lower it, down to 1, which turns the rule off, to compare a repetitive password such as one built from a repeated word, and masks and padding then match too. They may raise it, to at most 16, the most a piece of the default length holds, to compare fewer repetitive values.
    docValue: 5 distinct characters
    docSummary: Fewest distinct characters a configured value, or a piece of one, needs to be compared. You can lower it to 1, which turns the rule off, or raise it to 16.
